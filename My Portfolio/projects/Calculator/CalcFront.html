
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcSpace | Welcome</title>
    <link rel="stylesheet" href="CalcFront.css">
</head>
<body>

    <nav>
        <div class="logo">Calculator<span>.project</span></div>
        <div class="nav-text">A simple calculator</div>
    </nav>

    <main class="hero">
        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>

        <div class="content">

            <h1>Make every<br>calculation <span>simple.</span></h1>

            <p class="description">
